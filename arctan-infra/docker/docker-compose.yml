services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Connect to Hermes API server with user identity forwarding
      - OPENAI_API_CONFIGS={"hermes":{"url":"http://host.docker.internal:8642/v1","key":"${API_SERVER_KEY}","enable_forward_user_info":true}}
      - WEBUI_AUTH=true
      - ENABLE_OLLAMA_API=false
    volumes:
      - open-webui:/app/backend/data
    restart: always

volumes:
  open-webui:

# =============================================================================
# Hermes Role-Based Tool Permissions
# =============================================================================
#
# Controls which tools each Open WebUI user role can access.
# Roles come from the X-OpenWebUI-User-Role header (set by Open WebUI).
# Open WebUI roles: "admin", "user", "pending" (default for new signups).
#
# If this file is missing or empty, ALL users get full platform toolsets
# (same behavior as before this feature existed).
#
# Changes are picked up automatically (file mtime checked per request).
# No gateway restart needed.
#
# Available toolsets (from hermes_cli/tools_config.py):
#   web, browser, terminal, file, code_execution, vision, image_gen,
#   moa, tts, skills, todo, memory, session_search, clarify,
#   delegation, cronjob, rl, homeassistant
#
# Available tool names (for denied_tools):
#   web_search, web_extract, browser_navigate, browser_snapshot,
#   browser_click, browser_type, browser_scroll, browser_back,
#   browser_press, browser_close, browser_get_images, browser_vision,
#   browser_console, terminal, process, read_file, write_file, patch,
#   search_files, execute_code, vision_analyze, image_generate,
#   mixture_of_agents, text_to_speech, skills_list, skill_view,
#   skill_manage, todo, memory, session_search, clarify,
#   delegate_task, cronjob
# =============================================================================

roles:
  # ── Admin: full access, no restrictions ──
  admin:
    allowed_toolsets: all

  # ── User: read/query access + limited write ──
  user:
    allowed_toolsets:
      - web
      - browser
      - file
      - vision
      - skills
      - todo
      - memory
      - session_search
      - clarify
    # Deny dangerous individual tools within allowed toolsets
    denied_tools:
      - write_file
      - patch
      - skill_manage

  # ── Pending: minimal access (new signups before admin approval) ──
  pending:
    allowed_toolsets:
      - web
      - skills
      - clarify
      - session_search
    denied_tools:
      - skill_manage

  # ── Default: fallback for unknown roles ──
  default:
    allowed_toolsets:
      - web
      - browser
      - file
      - vision
      - skills
      - todo
      - memory
      - session_search
      - clarify
    denied_tools:
      - write_file
      - patch
      - skill_manage

# =============================================================================
# Per-email overrides (optional)
# =============================================================================
# Override role for specific users. Two formats:
#
#   email@domain.com: role_name     # Map to an existing role
#   email@domain.com:               # Inline custom config
#     allowed_toolsets: [...]
#     denied_tools: [...]
#
# Examples:
#   intern@arctan.ai: pending       # Restrict intern to pending role
#   cto@arctan.ai: admin            # Ensure CTO always has admin tools
# =============================================================================

# user_overrides:
#   example@arctan.ai: admin
